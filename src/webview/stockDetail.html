<!-- 个股详情片段（终端化）：样式、HTML、JS 均在此文件，由 stockHome.ts 提取注入 -->
<!-- 注意：经 esbuild minifyHtml 压缩，字符串字面量中禁止连续多空格，对齐空白用 padW()/repeat() 生成 -->
<style>
  /* 终端提示符风格头部 */
  .s-header {
    flex-shrink: 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--vscode-panel-border, #454545);
    font-family: var(--vscode-editor-font-family), monospace;
    font-size: 13px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .s-header pre {
    margin: 0;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-all;
    flex: 1;
    min-width: 0;
  }
  .s-head-line {
    font-weight: 500;
  }
  .btn-refresh {
    background: none;
    border: none;
    color: var(--vscode-textLink-foreground, #3794ff);
    padding: 0 2px;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
  }
  .btn-refresh:hover {
    text-decoration: underline;
  }

  /* 分时终端区 */
  #chart-wrap {
    flex-shrink: 0;
    width: 100%;
    overflow: hidden;
  }
  #chart-term {
    margin: 0;
    font-family: var(--vscode-editor-font-family), monospace;
    font-size: var(--vscode-editor-font-size, 13px);
    line-height: 1.15;
    white-space: pre;
    overflow-x: hidden;
    color: var(--vscode-editor-foreground);
    font-variant-numeric: tabular-nums;
  }
  /* 窄面板：列数触底后横向滚动，不挤压变形（方案 §6-1） */
  #chart-term.scroll-x {
    overflow-x: auto;
    scrollbar-width: thin;
  }
</style>

<div class="s-header" id="s-header"></div>
<div id="chart-wrap">
  <pre id="chart-term"></pre>
</div>

<script>
  /* ---- DOM 缓存（本片段相关元素） ---- */
  const sHeader = $("s-header");

  /* ---- 刷新按钮 ---- */
  sHeader.addEventListener("click", (e) => {
    if (e.target.closest(".btn-refresh"))
      vscode.postMessage({ type: "refresh" });
  });

  /* ---- 渲染个股头部：终端提示符 + kv 文本块 ---- */
  function renderHeader() {
    if (activeCode === "__overview__") return;
    const s = activeInfo;
    const q = activeQuote;
    if (!s) {
      sHeader.innerHTML = '<pre class="gray">' + escHtml("加载中…") + "</pre>";
      return;
    }

    const v = parseFloat(s.changePercent);
    const sign = v > 0 ? "+" : "";
    const dec = s.isETF ? 3 : 2;
    const cur = q ? fmtNum(q.current, dec) : fmtNum(s.current, dec);
    const chg = fmtNum(s.changeValue, dec);
    /* 涨跌用 +/- 与数值表达，不着色（方案 §4.1） */
    const head =
      "❯ " +
      s.code.toLowerCase() + " " +
      (s.displayName || s.name) + " " +
      cur + " " +
      sign + s.changePercent + "% (" +
      sign + chg + ")" +
      (s.dateTime ? " " + s.dateTime : "");

    const lines = [head, ""];
    if (q) {
      /* kv 块：两字中文标签 + 按显示宽度对齐（中文占 2 列，见 §6-4） */
      const row = (a, b, c, d) =>
        " ".repeat(2) + padW(a, 12) + padW(b, 14) + padW(c, 12) + d;
      const kv = (label, val) => label + " " + (val == null ? "-" : val);
      lines.push(
        row(
          kv("今开", fmtNum(q.open, dec)),
          kv("最高", fmtNum(q.high, dec)),
          kv("最低", fmtNum(q.low, dec)),
          kv("昨收", fmtNum(q.close, dec)),
        ),
        row(
          kv("成交", fmtVol(q.volume)),
          kv("额", fmtMoney(q.amount)),
          kv("换手", q.turnoverRatio != null ? fmtNum(q.turnoverRatio) + "%" : "-"),
          kv("量比", q.volumeRatio != null ? fmtNum(q.volumeRatio) : "-"),
        ),
        row(
          kv("市盈", q.pe != null ? fmtNum(q.pe) : "-"),
          kv("市净", q.pb != null ? fmtNum(q.pb) : "-"),
          kv("总市值", fmtMoney(q.totalMarket)),
          kv("流值", fmtMoney(q.circulationMarket)),
        ),
      );
    }

    sHeader.innerHTML =
      '<pre class="s-head-line">' +
      escHtml(lines.join("\n")) +
      '</pre><button class="btn-refresh">[刷新]</button>';
  }

  /* ---- 加载中状态：终端化措辞 ---- */
  function showLoading() {
    showDetail();
    minuteData = null;
    const term = $("chart-term");
    if (term) {
      term.classList.remove("scroll-x");
      term.innerHTML =
        '<span class="gray">' + escHtml("等待分时数据…") + "</span>";
    }
  }
</script>

<!-- A股全览片段（终端化）：样式、HTML、JS 均在此文件，由 stockHome.ts 提取注入 -->
<!-- 注意：经 esbuild minifyHtml 压缩，字符串字面量中禁止连续多空格，对齐空白用 padW()/repeat() 生成 -->
<style>
  .overview-wrap {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  /* 小节标题：终端提示符 + 右侧文本按钮 */
  .ov-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .ov-head-title {
    color: var(--vscode-editor-foreground);
  }
  .ov-pre {
    margin: 0;
    font-family: var(--vscode-editor-font-family), monospace;
    font-size: var(--vscode-editor-font-size, 13px);
    line-height: 1.45;
    white-space: pre;
    color: var(--vscode-editor-foreground);
    font-variant-numeric: tabular-nums;
  }
  /* 行业列表：空格分隔的 chip 流，按空格自动换行 */
  .ov-chips {
    white-space: pre-wrap;
    word-break: break-word;
  }
  .btn-refresh {
    background: none;
    border: none;
    color: var(--vscode-textLink-foreground, #3794ff);
    padding: 0 2px;
    cursor: pointer;
    font-family: inherit;
    font-size: inherit;
    flex-shrink: 0;
  }
  .btn-refresh:hover {
    text-decoration: underline;
  }
</style>

<div class="overview-wrap" id="overview-wrap">
  <div class="ov-head">
    <span class="ov-head-title" id="index-title"></span>
    <button class="btn-refresh" id="refresh-btn">[刷新]</button>
  </div>
  <pre class="ov-pre" id="index-cards"></pre>

  <div class="ov-head">
    <span class="ov-head-title" id="industry-title"></span>
    <button class="btn-refresh" id="refresh-industry-btn">[刷新]</button>
  </div>
  <pre class="ov-pre ov-chips" id="industry-cards"></pre>
</div>

<script>
  /* ---- 涨跌幅文本：正数补 + 号，无涨跌着色的替代表达（方案 §4.1） ---- */
  function ovPct(v) {
    const n = parseFloat(v);
    if (isNaN(n)) return "-";
    return (n > 0 ? "+" : "") + v + "%";
  }

  /* ---- 指数表：每行两组「名称 价格 涨跌幅」，定宽对齐 ---- */
  function renderIndexTable(list) {
    const el = $("index-cards");
    if (!el) return;
    if (!list?.length) {
      el.textContent = "  暂无数据";
      return;
    }
    const cell = (s) =>
      padW(s.name || "-", 10) + padW(s.current || "-", 9) + ovPct(s.changePercent);
    const rows = [];
    for (let i = 0; i < list.length; i += 2) {
      const a = cell(list[i]);
      const b = list[i + 1] ? cell(list[i + 1]) : "";
      rows.push("  " + padW(a, 28) + b);
    }
    el.textContent = rows.join("\n");
  }

  /* ---- 行业列表：按涨幅降序，空格分隔的 chip 流 ---- */
  function renderIndustryChips(list) {
    const el = $("industry-cards");
    if (!el) return;
    if (!list?.length) {
      el.textContent = "  暂无数据";
      return;
    }
    const sorted = [...list].sort(
      (a, b) => parseFloat(b.changePercent) - parseFloat(a.changePercent),
    );
    el.textContent =
      "  " +
      sorted
        .map((s) => (s.name || "-") + " " + ovPct(s.changePercent))
        .join(" ".repeat(2));
  }

  function renderOverviewCards() {
    renderIndexTable(indexStocks);
    renderIndustryChips(industryStocks);
  }

  function showSectionLoading(elementId) {
    const el = $(elementId);
    if (el) el.textContent = "  正在获取数据…";
  }

  /* 小节标题（终端提示符风格） */
  $("index-title").textContent = "❯ overview — 大盘指数";
  $("industry-title").textContent = "❯ 行业板块（涨幅排序）";

  overviewContainer.addEventListener("click", (e) => {
    if (e.target.closest("#refresh-btn")) {
      showSectionLoading("index-cards");
      vscode.postMessage({ type: "refreshIndex" });
    } else if (e.target.closest("#refresh-industry-btn")) {
      showSectionLoading("industry-cards");
      vscode.postMessage({ type: "refreshIndustry" });
    }
  });
</script>

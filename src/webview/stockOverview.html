<!-- 全览片段：样式、HTML、JS 均在此文件，由 stockHome.js 提取注入 -->
<style>
  .overview-wrap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .overview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--vscode-panel-border, #454545);
  }
  .overview-title {
    font-size: 12px;
    color: var(--vscode-descriptionForeground, #888);
  }
  /* chip 流：每条一段内联文本，自动换行，信息密度接近日志汇总 */
  .ov-rows {
    display: flex;
    flex-wrap: wrap;
    gap: 3px 18px;
    padding: 2px 4px;
  }
  .ov-chip {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .ov-name {
    font-weight: 500;
  }
  .ov-chg {
    font-size: 11px;
  }
</style>
<div class="overview-wrap" id="overview-wrap">
  <div class="overview-header">
    <div class="overview-title">大盘指数</div>
    <button class="btn-refresh" id="refresh-btn">↻ 刷新</button>
  </div>
  <div class="ov-rows" id="index-rows"></div>

  <div class="overview-header">
    <div class="overview-title">行业板块</div>
    <button class="btn-refresh" id="refresh-industry-btn">↻ 刷新</button>
  </div>
  <div class="ov-rows" id="industry-rows"></div>
</div>

<script>
  /**
   * chip 流渲染：无涨跌配色，涨跌仅靠 +/- 符号表达
   * @param {HTMLElement} container - 容器元素
   * @param {Array} list - 数据列表
   * @param {Object} options - showPrice 是否显示价格，sorted 是否按涨跌幅降序
   */
  function renderRows(
    container,
    list,
    { showPrice = true, sorted = false } = {},
  ) {
    if (!container) return;
    if (!list?.length) {
      container.innerHTML = "";
      return;
    }

    const items = sorted
      ? [...list].sort(
          (a, b) => parseFloat(b.changePercent) - parseFloat(a.changePercent),
        )
      : list;

    container.innerHTML = items
      .map((s) => {
        const v = parseFloat(s.changePercent);
        const sign = v > 0 ? "+" : "";
        const price = showPrice ? `<span>${s.current}</span>` : "";
        return `<span class="ov-chip" data-code="${s.code}">
          <span class="ov-name">${escHtml(s.name)}</span>
          ${price}
          <span class="ov-chg">${sign}${s.changePercent}%</span>
        </span>`;
      })
      .join("");
  }

  function renderOverviewCards() {
    renderRows($("index-rows"), indexStocks, { showPrice: true });
    renderRows($("industry-rows"), industryStocks, {
      showPrice: false,
      sorted: true,
    });
  }

  function showSectionLoading(elementId) {
    const el = $(elementId);
    if (el) {
      el.innerHTML =
        '<div style="padding: 12px; text-align: center; color: var(--vscode-descriptionForeground, #888);">正在获取数据...</div>';
    }
  }

  overviewContainer.addEventListener("click", (e) => {
    if (e.target.closest("#refresh-btn")) {
      showSectionLoading("index-rows");
      vscode.postMessage({ type: "refreshIndex" });
    } else if (e.target.closest("#refresh-industry-btn")) {
      showSectionLoading("industry-rows");
      vscode.postMessage({ type: "refreshIndustry" });
    }
  });
</script>

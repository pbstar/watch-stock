<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 样式层保留 unsafe-inline：VS Code 会向 webview 文档注入默认样式；
         脚本层用 nonce 收紧，面板文本全部经 textContent 写入，无 HTML 注入面 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}';"
    />
    <title>watch-stock</title>
    <style nonce="{{NONCE}}">
      {{STYLE}}
    </style>
  </head>

  <body>
    <div class="tab-bar" id="tab-bar"></div>
    <main class="main">
      <div class="content">
        <section class="pane" id="overview-pane">
          <div class="pane-head">
            <span id="index-title"></span>
            <button class="link-btn" id="refresh-index">[刷新]</button>
          </div>
          <pre class="term" id="index-table"></pre>
          <div class="pane-head">
            <span id="industry-title"></span>
            <button class="link-btn" id="refresh-industry">[刷新]</button>
          </div>
          <pre class="term term-wrap" id="industry-flow"></pre>
        </section>

        <section class="pane" id="detail-pane" hidden>
          <div class="detail-head">
            <pre class="term" id="detail-text"></pre>
            <button class="link-btn" id="refresh-detail">[刷新]</button>
          </div>
          <div class="chart" id="chart-wrap">
            <pre class="term" id="chart-plot"></pre>
            <pre class="term dim" id="chart-axis"></pre>
            <pre class="term dim" id="chart-volume"></pre>
            <pre class="term dim" id="chart-summary"></pre>
          </div>
        </section>
      </div>
    </main>

    <script nonce="{{NONCE}}">
      {{SCRIPT}}
    </script>
  </body>
</html>
